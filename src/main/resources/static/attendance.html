
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h2>Attendance Tracker</h2>
    <a href="dashboard.html">Back to Dashboard</a>
</header>

<main class="page-container">
    <h1>Manage Attendance</h1>
    <p>Enter your subject attendance details.</p>

    <form id="attendanceForm">
        <label for="subject">Subject Name</label>
        <input type="text" id="subject" placeholder="e.g. Java Programming" required>

        <label for="totalClasses">Total Classes</label>
        <input type="number" id="totalClasses" min="1" required>

        <label for="attendedClasses">Attended Classes</label>
        <input type="number" id="attendedClasses" min="0" required>

        <button type="submit">Save Attendance</button>
        <p id="message"></p>
    </form>

    <h2>Attendance Records</h2>
    <div id="attendanceList" class="data-list"></div>
</main>

<script src="script.js"></script>
<script>
    const attendanceForm = document.getElementById("attendanceForm");

    attendanceForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const total = Number(document.getElementById("totalClasses").value);
        const attended = Number(document.getElementById("attendedClasses").value);

        if (total < 1 || attended < 0 || attended > total) {
            showMessage("Please enter valid class counts.");
            return;
        }

        const attendance = {
            subject: document.getElementById("subject").value.trim(),
            totalClasses: total,
            attendedClasses: attended
        };

        try {
            await submitRecord("attendance", attendance);
            showMessage("Attendance saved successfully!", false);
            attendanceForm.reset();
            loadRecords("attendance", "attendanceList", record => {
                const percentage = (
                    record.attendedClasses / record.totalClasses * 100
                ).toFixed(1);

                return `${record.subject}: ${record.attendedClasses}/${record.totalClasses} classes (${percentage}%)`;
            });
        } catch (error) {
            showMessage(error.message);
        }
    });

    loadRecords("attendance", "attendanceList", record => {
        const percentage = (
            record.attendedClasses / record.totalClasses * 100
        ).toFixed(1);

        return `${record.subject}: ${record.attendedClasses}/${record.totalClasses} classes (${percentage}%)`;
    });
</script>
</body>
</html>
