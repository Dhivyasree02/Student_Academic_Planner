
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Marks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h2>Semester Marks</h2>
    <a href="dashboard.html">Back to Dashboard</a>
</header>

<main class="page-container">
    <h1>Manage Semester Marks</h1>
    <p>Enter your subject marks and view your percentage.</p>

    <form id="marksForm">
        <label for="subject">Subject Name</label>
        <input type="text" id="subject" placeholder="e.g. Java Programming" required>

        <label for="semester">Semester</label>
        <select id="semester" required>
            <option value="">Select Semester</option>
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
        </select>

        <label for="marks">Marks Obtained</label>
        <input type="number" id="marks" min="0" step="0.5" required>

        <label for="totalMarks">Total Marks</label>
        <input type="number" id="totalMarks" min="1" step="0.5" required>

        <button type="submit">Save Marks</button>
        <p id="message"></p>
    </form>

    <h2>Saved Marks</h2>
    <div id="marksList" class="data-list"></div>
</main>

<script src="script.js"></script>
<script>
    const marksForm = document.getElementById("marksForm");

    function displayMarks(record) {
        const percentage =
            (record.marks / record.totalMarks * 100).toFixed(1);

        return `${record.subject} | ${record.semester} | ${record.marks}/${record.totalMarks} | ${percentage}%`;
    }

    marksForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const marks = Number(document.getElementById("marks").value);
        const totalMarks = Number(document.getElementById("totalMarks").value);

        if (marks < 0 || totalMarks <= 0 || marks > totalMarks) {
            showMessage("Enter valid marks. Obtained marks cannot exceed total marks.");
            return;
        }

        const record = {
            subject: document.getElementById("subject").value.trim(),
            semester: document.getElementById("semester").value,
            marks: marks,
            totalMarks: totalMarks
        };

        try {
            await submitRecord("marks", record);
            showMessage("Marks saved successfully!", false);
            marksForm.reset();
            loadRecords("marks", "marksList", displayMarks);
        } catch (error) {
            showMessage(error.message);
        }
    });

    loadRecords("marks", "marksList", displayMarks);
</script>

</body>
</html>
